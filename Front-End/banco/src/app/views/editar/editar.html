<div class="container">
    <h2 class="titulo">Confirmar exclusão</h2>
    
    <div class="conteudo">
      Insira as novas informações desse cliente.
    </div>

    <form class="form" [formGroup]="formulario" (ngSubmit)="confirmar(cliente.id)">
        <div class="campo">
            <label for="nome" class="titulo2">Nome:</label>
            <input type="text" id="nome" formControlName="nome">
        </div>

        <div class="campo">
            <label for="email" class="titulo2" >Email:</label>
            <input type="email" id="email" formControlName="email">
        </div>

        <div class="fundo">
          <button class="btnCancelar" (click)="cancelar()">Cancelar</button>
        
          <button class="btnConfirmar" type="submit">
            Salvar
          </button>
        </div>

      </form>
    
</div>
