<div class="container">
    <h2 class="titulo">Cadastrar Cliente</h2>

    <form class="form" [formGroup]="formulario" (ngSubmit)="cadastrar()">
        <div class="campo">
            <label for="nome" class="titulo2" >Nome:</label>
            <input type="text" id="nome" formControlName="nome" required>
        </div>

        <div class="campo">
            <label for="email" class="titulo2" >Email:</label>
            <input type="email" id="email" formControlName="email" required="">
        </div>

        <div class="fundo">
          <button class="btnCancelar" (click)="cancelar()">Cancelar</button>
        
          <button class="btnConfirmar" type="submit">
            Cadastrar
          </button>
        </div>

      </form>

      <span *ngIf="erroMensagem">{{ erroMensagem }}</span>
    
</div>
