<main>
    <header class="cabecalho">
        <div class="container">
            <img src="assets/logo.svg" alt="Logo do Banco Itau" class="logo">
            <h1 class="nomeAba">Clientes</h1>
        </div>
    </header>
    <section class="containerConteudo">
        <div class="boxInfos" *ngFor="let cliente of clientes">
            <div class="fundo">
                <div>
                    <p class="tituloCliente">{{ cliente.nome }}</p>
                    <p class="conteudo">{{ cliente.email }}</p>
                    <p class="conteudo">R$ {{ cliente.saldo }}</p>
                </div>
                <div class="boxIcon">
                    <mat-icon class="cursor" (click)="abrirInfo(cliente.id)">edit</mat-icon>
                    <mat-icon class="cursor" (click)="deletarCliente(cliente.id)">delete</mat-icon>
                </div>
            </div>
        </div>
        
    </section>
    <div>
        <button mat-fab color="primary" class="fab" (click)="abrirCadastro()">
            <mat-icon>add</mat-icon>
        </button>
    </div>
</main>
